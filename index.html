<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f7f5f1">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121411">
  <meta name="description" content="Pantry — een eenvoudige, statische receptenapp die lokaal op je apparaat werkt.">
  <title>Pantry</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%235f7f6b' stroke-width='1.7' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M7.5 11.5a3.5 3.5 0 1 1 1.2-6.8 4 4 0 0 1 6.6 0 3.5 3.5 0 1 1 1.2 6.8V18h-9v-6.5Z'/%3E%3Cpath d='M7.5 15h9'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <noscript>
    <p style="padding: 24px; font-family: system-ui, sans-serif;">
      Pantry heeft JavaScript nodig. Schakel JavaScript in en herlaad de pagina. /
      Pantry needs JavaScript. Enable it and reload the page.
    </p>
  </noscript>

  <!-- Inline SVG icon sprite. Keeps the app image-free and fully static. -->
  <svg class="svg-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
    <symbol id="icon-hat" viewBox="0 0 24 24">
      <path d="M7.5 11.5a3.5 3.5 0 1 1 1.2-6.8 4 4 0 0 1 6.6 0 3.5 3.5 0 1 1 1.2 6.8V18h-9v-6.5Z"/>
      <path d="M7.5 15h9"/>
    </symbol>
    <symbol id="icon-pot" viewBox="0 0 24 24">
      <path d="M4 10h16v6a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3v-6Z"/>
      <path d="M2 10h20"/>
      <path d="M8 6c0-1 1-2 2-2M14 6c0-1 1-2 2-2"/>
    </symbol>
    <symbol id="icon-bag" viewBox="0 0 24 24">
      <path d="M6 8h12l-1 12H7L6 8Z"/>
      <path d="M9 8V6a3 3 0 0 1 6 0v2"/>
    </symbol>
    <symbol id="icon-bulb" viewBox="0 0 24 24">
      <path d="M9 18h6"/>
      <path d="M10 21h4"/>
      <path d="M12 3a6 6 0 0 0-3.5 10.9c.6.4 1 1.1 1 1.9V18h5v-2.2c0-.8.4-1.5 1-1.9A6 6 0 0 0 12 3Z"/>
    </symbol>
    <symbol id="icon-gear" viewBox="0 0 24 24">
      <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2Z"/>
      <circle cx="12" cy="12" r="3"/>
    </symbol>
    <symbol id="icon-search" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="7"/>
      <path d="m20 20-3.5-3.5"/>
    </symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24">
      <path d="M12 5v14M5 12h14"/>
    </symbol>
    <symbol id="icon-minus" viewBox="0 0 24 24">
      <path d="M5 12h14"/>
    </symbol>
    <symbol id="icon-back" viewBox="0 0 24 24">
      <path d="m15 18-6-6 6-6"/>
    </symbol>
    <symbol id="icon-close" viewBox="0 0 24 24">
      <path d="M18 6 6 18M6 6l12 12"/>
    </symbol>
    <symbol id="icon-edit" viewBox="0 0 24 24">
      <path d="M12 20h9"/>
      <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>
    </symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24">
      <path d="M3 6h18"/>
      <path d="M8 6V4h8v2"/>
      <path d="M19 6l-1 14H6L5 6"/>
      <path d="M10 11v6M14 11v6"/>
    </symbol>
    <symbol id="icon-mic" viewBox="0 0 24 24">
      <rect x="9" y="3" width="6" height="11" rx="3"/>
      <path d="M5 11a7 7 0 0 0 14 0"/>
      <path d="M12 18v3"/>
      <path d="M8 21h8"/>
    </symbol>
    <symbol id="icon-stop" viewBox="0 0 24 24">
      <rect x="7" y="7" width="10" height="10" rx="2"/>
    </symbol>
    <symbol id="icon-play" viewBox="0 0 24 24">
      <path d="m9 6 10 6-10 6V6Z"/>
    </symbol>
    <symbol id="icon-check" viewBox="0 0 24 24">
      <path d="m5 12 5 5L20 7"/>
    </symbol>
    <symbol id="icon-arrow-right" viewBox="0 0 24 24">
      <path d="M5 12h14M13 6l6 6-6 6"/>
    </symbol>
    <symbol id="icon-arrow-left" viewBox="0 0 24 24">
      <path d="M19 12H5M11 18l-6-6 6-6"/>
    </symbol>
    <symbol id="icon-book" viewBox="0 0 24 24">
      <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
      <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/>
    </symbol>
    <symbol id="icon-user" viewBox="0 0 24 24">
      <circle cx="12" cy="8" r="4"/>
      <path d="M4 21a8 8 0 0 1 16 0"/>
    </symbol>
    <symbol id="icon-refresh" viewBox="0 0 24 24">
      <path d="M21 12a9 9 0 1 1-2.6-6.4"/>
      <path d="M21 3v6h-6"/>
    </symbol>
  </svg>

  <!-- Splash / start screen -->
  <section id="splash" class="splash" aria-labelledby="splash-wordmark">
    <button id="splash-button" class="splash__button" type="button" disabled aria-label="Start">
      <span class="splash__hat" aria-hidden="true"><svg class="icon"><use href="#icon-hat"></use></svg></span>
      <span id="splash-wordmark" class="splash__wordmark">Pantry</span>
      <span id="splash-hint" class="splash__hint">Tik om te beginnen</span>
    </button>
    <p id="splash-warning" class="splash__warning" role="alert" hidden></p>
    <details id="splash-privacy" class="splash__privacy" hidden>
      <summary id="splash-privacy-title" class="splash__privacy-title"></summary>
      <p id="splash-privacy-body" class="splash__privacy-body"></p>
    </details>
  </section>

  <!-- Main application shell -->
  <div id="app" class="app" hidden>
    <header class="app-header">
      <button id="header-back" class="icon-button" type="button" aria-label="Terug" hidden>
        <svg class="icon"><use href="#icon-back"></use></svg>
      </button>
      <div class="app-header__brand">
        <svg class="icon app-header__hat" aria-hidden="true"><use href="#icon-hat"></use></svg>
        <span>Pantry</span>
      </div>
      <button id="open-settings" class="icon-button" type="button" aria-label="Instellingen">
        <svg class="icon"><use href="#icon-gear"></use></svg>
      </button>
    </header>

    <main id="view" class="view" tabindex="-1"></main>

    <nav class="tabbar" aria-label="Hoofdnavigatie">
      <button class="tabbar__item" data-tab="cooking" type="button">
        <svg class="icon" aria-hidden="true"><use href="#icon-pot"></use></svg>
        <span data-nav-label="cooking">Koken</span>
      </button>
      <button class="tabbar__item" data-tab="shopping" type="button">
        <svg class="icon" aria-hidden="true"><use href="#icon-bag"></use></svg>
        <span data-nav-label="shopping">Boodschappen</span>
      </button>
      <button class="tabbar__item" data-tab="brainstorm" type="button">
        <svg class="icon" aria-hidden="true"><use href="#icon-bulb"></use></svg>
        <span data-nav-label="brainstorm">Brainstormen</span>
      </button>
    </nav>
  </div>

  <div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>
  <div id="overlay-root" class="overlay-root"></div>
  <div id="modal-root"></div>

  <!-- Local-only app. No external scripts or network services. -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
